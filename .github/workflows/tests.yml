name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use the minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Vendored dependency integrity and offline import
        run: |
          python3 tests/test_vendor.py
          bash -n scripts/update-websockets-vendor

      - name: Python syntax
        run: python3 -m py_compile bin/hass-bridge tests/*.py

      - name: Bridge (NDJSON in, NDJSON out, against a fake Home Assistant)
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/test_bridge.py

      - name: JavaScript domain and lifecycle modules
        run: |
          node tests/test_config.js
          node tests/test_connection.js
          node tests/test_store.js
          node tests/test_model.js
          node tests/test_row_model.js
          node tests/test_panel_state.js
          node tests/test_list_sync.js

      - name: Service security and manifest contract
        run: python3 tests/test_service_contract.py

      - name: QML house style (fonts, palette, text format)
        run: python3 tests/test_qml_style.py

      - name: QML parser when available on the runner
        run: |
          if command -v qmlformat >/dev/null; then
            # Panel.qml contains Quickshell's typed IpcHandler methods. The
            # standalone Qt parser doesn't know that extension (qmlformat=1,
            # qmllint=255), while the remaining QML is standard syntax.
            for file in BridgeController.qml CredentialManager.qml EntityRow.qml Service.qml Settings.qml SettingsEntityRow.qml controls/*.qml; do
              qmlformat "$file" >/dev/null
            done
          fi
          if command -v qmllint >/dev/null; then
            for file in BridgeController.qml CredentialManager.qml EntityRow.qml Service.qml Settings.qml SettingsEntityRow.qml controls/*.qml; do
              qmllint "$file"
            done
          fi

      - name: Omarchy plugin validation when available on the runner
        run: |
          if command -v omarchy >/dev/null; then
            omarchy plugin validate .
          fi
